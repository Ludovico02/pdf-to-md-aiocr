services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ocr
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

volumes:
  ollama_storage: